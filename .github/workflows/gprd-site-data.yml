name: GPRD site data

on:
  schedule:
    - cron: "30 22 * * 1-5"   # weekdays, 22:30 UTC — after the US close
  workflow_dispatch:           # adds a "Run workflow" button for manual refreshes

permissions:
  contents: write

concurrency:
  group: gprd-site-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pandas numpy scipy matplotlib openpyxl yfinance

      - name: Build site data
        working-directory: geopolitical_risk_index
        run: python export_site_data.py

      - name: Commit if the data changed
        run: |
          git add geopolitical_risk_index/site/gprd_gold.json
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "GPRD site data: $(date -u +%F)"
            git push
          fi
